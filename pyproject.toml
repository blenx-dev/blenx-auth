[project]
name = "blenx-auth"
version = "0.3.3"
description = "Reusable authentication library for Python web applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.0,<3.0",
  "pyjwt>=2.8,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "httpx-oauth>=0.17.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "beanie>=1.30.0",
  "sqlalchemy[asyncio]>=2.0.51",
  "fastapi[standard]>=0.141.1",
  "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
# FastAPI integration layer. Depends on the SQLAlchemy backend so the default
# storage adapter is usable out of the box when installing this extra alone.
fastapi = ["fastapi[standard]>=0.115,<1.0", "sqlalchemy[asyncio]>=2.0.51"]
# SQLAlchemy backend (default storage; the DB driver is the host app's choice).
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.51"]
# Optional Beanie (MongoDB) backend.
beanie = ["beanie>=1.27,<2.0", "motor>=3.4,<4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blenx_auth"]
# The PEP 561 ``py.typed`` marker must ship in the wheel so type checkers
# analyze the package instead of treating it as an untyped dependency.
artifacts = ["src/blenx_auth/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/blenx_auth", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Examples and test fixtures intentionally use hardcoded passwords / tokens.
"examples/*" = ["S105", "S106"]
"tests/*" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
