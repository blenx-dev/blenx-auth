site_name: blenx-auth
site_description: Reusable authentication library for Python web applications
site_url: https://kupras06.github.io/styleos/blenx-auth/
repo_url: https://github.com/kupras06/styleos
repo_name: kupras06/styleos
edit_uri: edit/main/libs/blenx-auth/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Examples: getting-started/examples.md
  - Core Concepts:
    - Architecture: core-concepts/architecture.md
    - Layering: core-concepts/layering.md
    - Protocols: core-concepts/protocols.md
    - ID Genericity: core-concepts/id-genericity.md
  - Adapters:
    - SQLAlchemy: adapters/sqlalchemy.md
    - Beanie (MongoDB): adapters/beanie.md
  - FastAPI Integration:
    - Setup: fastapi/setup.md
    - Routers: fastapi/routers.md
    - Permissions: fastapi/permissions.md
    - OAuth: fastapi/oauth.md
    - Error Handling: fastapi/error-handling.md
  - Token Strategies:
    - JWT (Default): token-strategies/jwt.md
    - Redis: token-strategies/redis.md
    - DB Sessions: token-strategies/db-sessions.md
  - Advanced:
    - Custom Backends: advanced/custom-backends.md
    - Extending User Model: extending-user-model.md
    - Rate Limiting: advanced/rate-limiting.md
    - Testing: advanced/testing.md
  - Reference:
    - Settings: reference/settings.md
    - Exceptions: reference/exceptions.md
    - API Reference: reference/api.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  # - pymdownx.emoji:
  #     emoji_index: !!python/name:material.extensions.emoji.twemoji
  #     emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - gen-files:
      scripts:
        - gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kupras06/styleos
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  version:
    provider: mike

copyright: Copyright &copy; 2024 blenx-auth contributors